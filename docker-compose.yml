services:
  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq_broker
    ports:
      - "61613:61613"
      - "8161:8161"
    environment:
      - ACTIVEMQ_ADMIN_LOGIN=admin
      - ACTIVEMQ_ADMIN_PASSWORD=admin
    volumes:
      - activemq_data:/opt/apache-activemq/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u admin:admin http://localhost:8161/api/jolokia || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_stomp_app
    volumes:
      - ./src:/var/www/html
    depends_on:
      activemq:
        condition: service_healthy
    networks:
      - app_network

volumes:
  activemq_data:

networks:
  app_network:
    driver: bridge
